name: Clipboard JSON Import Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Character card parser unit tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: cd Packages/MoonlitCore && swift test

  simulator-import:
    name: iPad simulator JSON paste import
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache llama.cpp simulator framework
        uses: actions/cache@v4
        with:
          path: build/llama-sim
          key: llama-sim-b11960-arm64
      - name: Run focused paste-import UI test
        env:
          MOONLIT_SMOKE_TEST: "1"
          LLAMA_TAG: b11960
        run: scripts/run-simulator-test.sh https://example.com/unused.gguf
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clipboard-import-test-diagnostics
          path: |
            logs/uitest.log
            logs/screenshots/
            logs/simulators.txt
          if-no-files-found: ignore

  ios-preview-build:
    name: Build tested candidate IPA
    needs: [core-tests, simulator-import]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch llama.cpp iOS binary
        run: scripts/fetch-llama.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iPadOS app
        run: scripts/build-ios.sh
      - name: Package IPA
        run: scripts/package-ipa.sh
      - name: Verify IPA structure
        run: scripts/verify-ipa.sh build/MoonlitTavern-unsigned.ipa
      - name: Upload candidate only after tests pass
        uses: actions/upload-artifact@v5
        with:
          name: moonlit-tavern-clipboard-import-0.1.1-18
          path: |
            build/MoonlitTavern-unsigned.ipa
            build/MoonlitTavern-unsigned.ipa.sha256
          if-no-files-found: error
