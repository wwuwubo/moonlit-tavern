name: Build (Xcode 27)

# 用 Xcode 27（iOS 27 SDK）额外编译一次，验证与 iPadOS 27 SDK 的兼容性。
# 独立于主构建，失败或排队都不影响主流程的 Release。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-xcode27-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_TAG: b11960
  LLAMA_SHA256: feba05e0b7cb5e682ae3354abb455bf9723ae2cc95c69e24d073264e6a34d759

jobs:
  ios-build-xcode27:
    name: iOS 构建（Xcode 27）
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 获取 llama.cpp XCFramework
        run: scripts/fetch-llama.sh
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 构建
        run: scripts/build-ios.sh
      - name: 打包并检查 IPA
        run: |
          scripts/package-ipa.sh
          set -o pipefail
          scripts/verify-ipa.sh build/MoonlitTavern-unsigned.ipa 2>&1 | tee logs/verify-ipa.log
      - name: 汇总
        if: always()
        run: |
          mkdir -p dist
          cp build/MoonlitTavern-unsigned.ipa dist/MoonlitTavern-unsigned-xcode27.ipa 2>/dev/null || true
          (cd logs && zip -qr ../dist/build-logs-xcode27.zip .) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-xcode27
          path: dist/
