name: Engine Test

# 用真实 GGUF 模型在 Apple Silicon Mac 上运行 App 的推理引擎代码（LlamaEngine.swift 原样编译）。
# 验证推理路径本身：加载、流式生成、停止、KV 缓存续用、群聊停止词、记忆摘要、长上下文。
# 这是 GitHub 的 macOS 虚拟机（Paravirtual GPU），不是 iPad；速度数字不能代表 M4 iPad Pro。
# 只在手动触发时运行，避免消耗私有仓库的 Actions 额度。

on:
  workflow_dispatch:
    inputs:
      label:
        description: "标签（用于日志分支名）"
        required: true
        default: qwen35-0.8b
      url:
        description: "GGUF 下载地址"
        required: true
        default: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
      ctx:
        description: "上下文长度"
        required: true
        default: "4096"

permissions:
  contents: write

env:
  LLAMA_TAG: b11960
  LLAMA_SHA256: feba05e0b7cb5e682ae3354abb455bf9723ae2cc95c69e24d073264e6a34d759

jobs:
  engine:
    name: 推理实测 · ${{ inputs.label }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: 获取 llama.cpp XCFramework
        run: scripts/fetch-llama.sh
      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ inputs.label }}
      - name: 运行推理实测
        run: scripts/run-engine-harness.sh "${{ inputs.url }}" "${{ inputs.label }}" "${{ inputs.ctx }}"
      - name: 推送日志到 ci-logs 分支
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-logs.sh engine-${{ inputs.label }}
