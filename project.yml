# XcodeGen 工程描述。CI 中执行 `xcodegen generate` 生成 MoonlitTavern.xcodeproj。
name: MoonlitTavern

options:
  bundleIdPrefix: com.wuwuyou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ARCHS: arm64
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  MoonlitCore:
    path: Packages/MoonlitCore

targets:
  MoonlitTavern:
    type: application
    platform: iOS
    sources:
      - path: MoonlitTavern
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: MoonlitCore
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    info:
      path: MoonlitTavern/Resources/Info.plist
      properties:
        CFBundleDisplayName: 月下酒馆
        CFBundleName: MoonlitTavern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让「文件」App 能看到「文稿」目录，可直接把 GGUF 模型拷进 Models 文件夹
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # 在「文件」里长按角色卡或模型 › 共享，可以直接交给月下酒馆打开
        CFBundleDocumentTypes:
          - CFBundleTypeName: 角色卡（JSON）
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
          - CFBundleTypeName: 角色卡（PNG）
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
          - CFBundleTypeName: GGUF 模型
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.ggml.gguf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ggml.gguf
            UTTypeDescription: GGUF 模型
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gguf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwuyou.moonlittavern
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_NAME: MoonlitTavern
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      configVariants: []
      testTargets:
        - MoonlitTavernUITests

  # UI 自动化测试（只在模拟器测试流程中构建，不进入 IPA）
  MoonlitTavernUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoonlitTavernUITests
    dependencies:
      - target: MoonlitTavern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuwuyou.moonlittavern.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoonlitTavern
